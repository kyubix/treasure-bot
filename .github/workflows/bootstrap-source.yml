name: Restore Treasure Bots source files
on:
  push:
    paths:
      - ".github/workflows/bootstrap-source.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Verify and extract source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part{01..08}.b64 | base64 --decode > /tmp/treasure-bot-source.tar.xz
          echo '1229000678e931431766c7f93efdecfc739f9f903861f3ba7ff8b234743af923  /tmp/treasure-bot-source.tar.xz' | sha256sum --check
          tar --extract --xz --file /tmp/treasure-bot-source.tar.xz --directory .
          test -f src/engine/game.ts
          test -f src/server/worker.ts
          test -f src/client/main.ts
          rm -rf .bootstrap
          # GITHUB_TOKEN cannot introduce new workflow files. CI will be added separately.
          rm -f .github/workflows/ci.yml

      - name: Commit unpacked source files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat: publish Treasure Bots alpha v0.1 source"
            git push origin HEAD:main
          fi
