name: Validate Treasure Bots
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Engine smoke tests
        run: npm test
      - name: Unit tests
        run: npm run test:unit
      - name: Typecheck and frontend build
        run: npm run build
