name: Visual Smoke (Android viewport)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-smoke-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  visual-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Check mobile navigation and collect evidence
        run: npx playwright test --config=playwright.config.mjs
      - name: Upload screenshots, trace and HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-smoke-evidence
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: warn
